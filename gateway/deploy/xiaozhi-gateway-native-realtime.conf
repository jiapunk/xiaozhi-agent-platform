[Service]
# Keep one full Realtime model/session responsible for VAD, response creation,
# interruption and multi-turn context. The Gateway remains responsible for
# ESP32 transport, AEC-cleaned audio, playback clearing and Agent tools.
Environment=S3CAM_OPENAI_REALTIME_MODEL=gpt-realtime-2.1
Environment=S3CAM_OPENAI_TRANSCRIPT_FIRST=0
Environment=S3CAM_OPENAI_REALTIME_ADAPTIVE_ROUTING=0
Environment=S3CAM_OPENAI_TRANSCRIPTION_MODEL=gpt-transcribe
Environment=S3CAM_OPENAI_SEMANTIC_EAGERNESS=medium
