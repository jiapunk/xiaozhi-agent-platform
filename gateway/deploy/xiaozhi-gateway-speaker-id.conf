[Unit]
Requires=xiaozhi-speaker-id.service
After=xiaozhi-speaker-id.service

[Service]
Environment=S3CAM_SPEAKER_ID_ENABLED=1
Environment=S3CAM_SPEAKER_EMBEDDING_URL=http://127.0.0.1:8767/v1/embedding
Environment=S3CAM_SPEAKER_ID_FILE=/var/lib/xiaozhi-gateway/speaker-identities.enc
Environment=S3CAM_SPEAKER_ID_KEY_FILE=/etc/xiaozhi-gateway/speaker-id.key
Environment=S3CAM_SPEAKER_ID_THRESHOLD=0.60
