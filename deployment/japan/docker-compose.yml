services:
  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile.s3cam-cloud
    restart: unless-stopped
    environment:
      S3CAM_GATEWAY_ADDRESS: ":8766"
      S3CAM_GATEWAY_PUBLIC_WS_URL: "wss://${GATEWAY_DOMAIN}/v1/device"
      S3CAM_GATEWAY_EXPECTED_DEVICE_ID: "${EXPECTED_DEVICE_ID}"
      S3CAM_GATEWAY_ALLOWED_DEVICE_IDS: "${ALLOWED_DEVICE_IDS:-}"
      S3CAM_GATEWAY_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      S3CAM_CLOUD_AI_ENABLED: "1"
      S3CAM_DASHSCOPE_API_KEY_FILE: /run/secrets/dashscope_api_key
      S3CAM_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      S3CAM_CLOUD_ASR_URL: "${DASHSCOPE_ASR_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions}"
      S3CAM_CLOUD_TTS_URL: "${DASHSCOPE_TTS_URL:-https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}"
      S3CAM_CLOUD_ASR_MODEL: "qwen3-asr-flash"
      S3CAM_CLOUD_AGENT_MODEL: "deepseek-v4-flash"
      S3CAM_CLOUD_TTS_MODEL: "qwen3-tts-flash"
      S3CAM_CLOUD_TTS_VOICE: "Cherry"
    secrets:
      - bootstrap_token
      - dashscope_api_key
      - deepseek_api_key
    expose:
      - "8766"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    networks:
      - gateway_net

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      GATEWAY_DOMAIN: "${GATEWAY_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - gateway_net

secrets:
  bootstrap_token:
    file: ./secrets/bootstrap_token
  dashscope_api_key:
    file: ./secrets/dashscope_api_key
  deepseek_api_key:
    file: ./secrets/deepseek_api_key

volumes:
  caddy_data:
  caddy_config:

networks:
  gateway_net:
